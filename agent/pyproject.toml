[project]
name = "nexus-graph-agent"
version = "0.2.0"
description = "Agentic RAG orchestration service with graph retrieval and MCP tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "langchain-core>=0.3,<1",
  "openai>=1.50,<2",
  "anthropic>=0.36,<1",
  "mcp>=1.1,<2",
  "asyncpg>=0.29,<1",
  "chromadb>=0.5,<1",
  "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
