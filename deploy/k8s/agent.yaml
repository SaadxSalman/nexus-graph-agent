apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-agent
  namespace: nexus
spec:
  replicas: 2
  selector:
    matchLabels: {app: nexus-agent}
  template:
    metadata:
      labels: {app: nexus-agent}
    spec:
      containers:
        - name: agent
          image: nexus-agent:local
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: nexus-config}
            - secretRef: {name: nexus-secrets, optional: true}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-agent
  namespace: nexus
spec:
  selector: {app: nexus-agent}
  ports: [{port: 8000, targetPort: 8000}]
