apiVersion: v1
kind: Namespace
metadata:
  name: nexus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
data:
  APP_ENV: production
  MODEL_PROVIDER: local
  AGENT_PORT: "8000"
  RUST_API_PORT: "8080"
  MAX_AGENT_ITERATIONS: "3"
  MAX_CONTEXT_CHARS: "12000"
  MCP_ALLOWED_TOOLS: local_search,entity_lookup
