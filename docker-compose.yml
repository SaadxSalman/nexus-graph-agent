services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
  chroma:
    image: chromadb/chroma:0.5.23
    ports: ["8001:8000"]
    volumes: ["chroma_data:/chroma/chroma"]
  agent:
    build:
      context: ./agent
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      chroma: {condition: service_started}
  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [agent]
volumes:
  postgres_data:
  chroma_data:
